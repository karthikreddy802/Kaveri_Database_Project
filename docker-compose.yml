services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kaveri}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2004}
    ports:
      - "5432:5432"
    volumes:
      - kaveri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kaveri}"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-import:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2004}
      POSTGRES_DB: ${DB_NAME:-kaveri}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-2004}
      DB_NAME: ${DB_NAME:-kaveri}
      PGHOST: db
    volumes:
      - ./db:/dump
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "sed -i 's/\\r$//' /dump/import.sh; exec /bin/sh /dump/import.sh"]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SECRET_KEY: ${SECRET_KEY:-kaveri-ec2-change-this-secret-key}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-kaveri}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-2004}
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://40.192.98.128:5173,http://40.192.98.128:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  kaveri_pgdata:
