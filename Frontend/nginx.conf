upstream kaveri_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 8m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location ^~ /auth { proxy_pass http://kaveri_api; }
    location = /me { proxy_pass http://kaveri_api; }
    location ^~ /properties { proxy_pass http://kaveri_api; }
    location ^~ /bookings { proxy_pass http://kaveri_api; }
    location ^~ /guests { proxy_pass http://kaveri_api; }
    location ^~ /reports { proxy_pass http://kaveri_api; }
    location ^~ /payments { proxy_pass http://kaveri_api; }
    location ^~ /docs { proxy_pass http://kaveri_api; }
    location = /openapi.json { proxy_pass http://kaveri_api; }

    location = /llms.txt {
        default_type text/markdown;
        add_header Access-Control-Allow-Origin *;
    }

    location = /llms-full.txt {
        default_type text/markdown;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
